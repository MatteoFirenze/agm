<div class="page-wrapper">

  <div class="toolbar">
    <label class="import-label">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path d="M288 109.3V352c0 17.7-14.3 32-32 32s-32-14.3-32-32V109.3l-73.4 73.4c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3l128-128c12.5-12.5 32.8-12.5 45.3 0l128 128c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L288 109.3zM64 352H192c0 35.3 28.7 64 64 64s64-28.7 64-64H448c35.3 0 64 28.7 64 64v32c0 35.3-28.7 64-64 64H64c-35.3 0-64-28.7-64-64V416c0-35.3 28.7-64 64-64z"/></svg>
      Importer Excel
      <input type="file" accept=".xlsx, .xlsb" (change)="readAndSortExcel($event)" class="import-hidden">
    </label>
    <button class="btn-action" [disabled]="isButtonDisabled" (click)="computeTotalItems()">
      Total produits
    </button>
    <button class="btn-reset" (click)="reset()">
      Réinitialiser
    </button>
  </div>

  <div class="columns-wrapper" cdkDropListGroup>

    <div class="column">
      <div class="column-header">
        <span>Tournée n°1</span>
        <button class="btn-print" [disabled]="isButtonDisabled" (click)="imprimer(1)">Imprimer</button>
      </div>
      <div cdkDropList class="example-list" (cdkDropListDropped)="drop($event)">
        <div class="example-box" *ngFor="let client of clients" cdkDrag>
          <span class="client-name">{{clients_nom_map.get(client)}}</span>
          <div class="containerIcon">
            <div class="svgContainer" (click)="deleteClient(client)">
              <svg class="red" xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 448 512"><path d="M135.2 17.7L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-7.2-14.3C307.4 6.8 296.3 0 284.2 0L163.8 0c-12.1 0-23.2 6.8-28.6 17.7zM416 128L32 128 53.2 467c1.6 25.3 22.6 45 47.9 45l245.8 0c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg>
            </div>
            <div class="svgContainer" (click)="developperFacture(client)">
              <svg class="gray" xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="column">
      <div class="column-header">
        <span>Tournée n°2</span>
        <button class="btn-print" [disabled]="isButtonDisabled" (click)="imprimer(2)">Imprimer</button>
      </div>
      <div cdkDropList class="example-list" (cdkDropListDropped)="drop($event)">
        <div class="example-box" *ngFor="let client of tournee1" cdkDrag>
          <span class="client-name">{{clients_nom_map.get(client)}}</span>
          <div class="containerIcon">
            <div class="svgContainer" (click)="deleteClient(client)">
              <svg class="red" xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 448 512"><path d="M135.2 17.7L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-7.2-14.3C307.4 6.8 296.3 0 284.2 0L163.8 0c-12.1 0-23.2 6.8-28.6 17.7zM416 128L32 128 53.2 467c1.6 25.3 22.6 45 47.9 45l245.8 0c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg>
            </div>
            <div class="svgContainer" (click)="developperFacture(client)">
              <svg class="gray" xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="column">
      <div class="column-header">
        <span>Tournée n°3</span>
        <button class="btn-print" [disabled]="isButtonDisabled" (click)="imprimer(3)">Imprimer</button>
      </div>
      <div cdkDropList class="example-list" (cdkDropListDropped)="drop($event)">
        <div class="example-box" *ngFor="let client of tournee2" cdkDrag>
          <span class="client-name">{{clients_nom_map.get(client)}}</span>
          <div class="containerIcon">
            <div class="svgContainer" (click)="deleteClient(client)">
              <svg class="red" xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 448 512"><path d="M135.2 17.7L128 32 32 32C14.3 32 0 46.3 0 64S14.3 96 32 96l384 0c17.7 0 32-14.3 32-32s-14.3-32-32-32l-96 0-7.2-14.3C307.4 6.8 296.3 0 284.2 0L163.8 0c-12.1 0-23.2 6.8-28.6 17.7zM416 128L32 128 53.2 467c1.6 25.3 22.6 45 47.9 45l245.8 0c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg>
            </div>
            <div class="svgContainer" (click)="developperFacture(client)">
              <svg class="gray" xmlns="http://www.w3.org/2000/svg" height="16" width="16" viewBox="0 0 512 512"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<p-messages class="custom-message"></p-messages>
<p-dialog header="Détail facture" [(visible)]="visible" [style]="{width: '50vw'}">
  <div [innerHTML]="stringAffichage"></div>
</p-dialog>
<p-confirmDialog [style]="{width: '40vw'}"></p-confirmDialog>
